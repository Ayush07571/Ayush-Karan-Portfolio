<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0f0d1b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Polygon Badge -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="8"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="4"/>

  <!-- AK Stylized Monogram Vector -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 170 370 L 225 150 L 255 150 L 310 370 L 265 370 L 252 315 L 208 315 L 195 370 Z M 218 275 L 242 275 L 230 215 Z" fill="url(#glowGrad)" />
    
    <!-- Code Bracket / Cyber Accent -->
    <path d="M 120 210 L 80 256 L 120 302" fill="none" stroke="#06b6d4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 392 210 L 432 256 L 392 302" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Active Emerald Pulse Dot -->
  <circle cx="256" cy="405" r="14" fill="#10b981" />
</svg>
